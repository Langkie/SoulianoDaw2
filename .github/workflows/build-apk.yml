name: Build Souliano DAW APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive if present
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -1 || true)

          if [ -n "${ZIP:-}" ]; then
            echo "Found archive: $ZIP"
            unzip -q "$ZIP" -d /tmp/souliano_daw
          else
            echo "No ZIP archive found; using repo contents directly."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="."
          else
            PROJECT=$(find /tmp/souliano_daw -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname || true)
          fi

          if [ -z "${PROJECT:-}" ]; then
            echo "No Android project found."
            find . -maxdepth 5 -type f | sed -n '1,120p'
            exit 1
          fi

          echo "Using project directory: $PROJECT"
          cd "$PROJECT"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulianoDAW-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
