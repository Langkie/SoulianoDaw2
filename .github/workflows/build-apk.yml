name: Build Souliano DAW APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Souliano DAW
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 3 -type f -iname '*Android36*Fixed*.zip' | head -1)

          if [ -z "${ZIP:-}" ]; then
            echo "No Android36 Fixed ZIP found in repo."
            find . -maxdepth 4 -type f | sed -n '1,80p'
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(dirname "$(find . -name settings.gradle.kts | head -1)")

          if [ -z "${PROJECT:-}" ]; then
            echo "No settings.gradle.kts found in the repo."
            find . -maxdepth 4 -type f | sed -n '1,80p'
            exit 1
          fi

          cd "$PROJECT"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulianoDAW-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
