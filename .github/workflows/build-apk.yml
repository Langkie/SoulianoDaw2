name: Build Souliano DAW APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract project archive if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -1 || true)
          if [ -n "${ZIP:-}" ]; then
            echo "Found archive: $ZIP"
            unzip -q "$ZIP" -d /tmp/souliano_daw
          else
            echo "No ZIP archive found; using repo contents directly."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          
          sdkmanager --version
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          PROJECT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="."
          else
            PROJECT=$(find /tmp/souliano_daw -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname || true)
          fi

          if [ -z "${PROJECT:-}" ]; then
            echo "Error: No Android project found."
            exit 1
          fi

          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SoulianoDAW-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 7
